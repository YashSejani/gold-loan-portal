services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goldloan
      POSTGRES_PASSWORD: goldloan
      POSTGRES_DB: goldloan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Probe over TCP: during first-run init Postgres only listens on the unix socket,
    # so this only passes once init scripts (incl. goldloan_test) have finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U goldloan -d goldloan && psql -h 127.0.0.1 -U goldloan -d goldloan_test -c 'select 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
